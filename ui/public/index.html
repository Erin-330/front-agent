<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCP Orchestrator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-950 flex items-center justify-center">
  <div class="w-full max-w-sm px-6">
    <div class="text-center mb-10">
      <div class="text-4xl mb-3">⚡</div>
      <h1 class="text-2xl font-bold text-white">MCP Orchestrator</h1>
      <p class="text-gray-400 text-sm mt-2">MCP 서버에 프롬프트를 전송하는 오케스트레이터</p>
    </div>

    <div id="error-box" class="hidden mb-4 p-3 bg-red-900/50 border border-red-700 rounded-lg text-red-300 text-sm"></div>

    <a href="/auth/github"
       class="flex items-center justify-center gap-3 w-full py-3 px-4 bg-white hover:bg-gray-100 text-gray-900 font-medium rounded-lg transition-colors">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
      </svg>
      GitHub로 로그인
    </a>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const err = params.get("error");
    if (err) {
      const box = document.getElementById("error-box");
      box.textContent = `로그인 실패: ${err}`;
      box.classList.remove("hidden");
    }

    // 이미 로그인된 경우 대시보드로
    fetch("/api/me").then(r => {
      if (r.ok) location.href = "/dashboard.html";
    });
  </script>
</body>
</html>
